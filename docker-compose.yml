# election-map — public live election-night results dashboard (UI + API + Socket.io), one container.
#
# Run from a git clone of this repo. Compose resolves relative paths against that dir, so ./data
# lands next to this file (the SQLite database). Never delete or reset it on a live deployment.

services:
  election-map:
    container_name: election-map
    build: .
    image: election-map:local
    restart: unless-stopped
    # Container user: set PUID / PGID in .env to the owner of ./data so the app can write its database.
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      PORT: 3710
    ports:
      # Bound to ONE host address, never 0.0.0.0. Default: localhost only. Set ELECTION_MAP_BIND_IP in .env
      # to the address your reverse proxy / tunnel reaches (then 127.0.0.1 on the host may not answer).
      - "${ELECTION_MAP_BIND_IP:-127.0.0.1}:${ELECTION_MAP_PORT:-3710}:3710"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3710/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
